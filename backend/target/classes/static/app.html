<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Hub</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="app-header">
    <strong>Class Hub</strong>
    <div class="usuario-info">
        <span id="usuario-nome"></span>
        <span class="badge-role" id="usuario-role"></span>
        <button class="secundario" id="btn-sair">Sair</button>
    </div>
</header>

<nav class="app-nav" id="app-nav">
    <button data-secao="dashboard">Dashboard</button>
    <button data-secao="turmas">Turmas</button>
    <button data-secao="tarefas">Tarefas</button>
    <button data-secao="notificacoes">Notificações</button>
    <button data-secao="admin-usuarios" id="nav-admin-usuarios">Usuários</button>
</nav>

<main class="app-main">
    <section id="sec-dashboard" class="secao">
        <h2>Dashboard</h2>
        <div id="dashboard-conteudo" class="grid-cartoes"></div>
    </section>

    <section id="sec-turmas" class="secao">
        <h2>Turmas</h2>
        <div class="cartao" id="form-nova-turma-wrapper" style="display:none">
            <h3>Nova turma</h3>
            <form id="form-nova-turma" class="formulario">
                <label>Nome da turma <input type="text" id="turma-nome" required /></label>
                <button type="submit">Criar turma</button>
            </form>
        </div>
        <div id="lista-turmas"></div>
    </section>

    <section id="sec-tarefas" class="secao">
        <h2>Tarefas</h2>
        <div class="cartao" id="form-nova-tarefa-wrapper" style="display:none">
            <h3>Nova tarefa</h3>
            <form id="form-nova-tarefa" class="formulario">
                <label>Turma
                    <select id="tarefa-turma" required></select>
                </label>
                <label>Título <input type="text" id="tarefa-titulo" required /></label>
                <label>Descrição <textarea id="tarefa-descricao"></textarea></label>
                <label>Tipo
                    <select id="tarefa-tipo">
                        <option value="INDIVIDUAL">Individual</option>
                        <option value="GRUPO">Grupo</option>
                    </select>
                </label>
                <label>Data limite <input type="datetime-local" id="tarefa-data-limite" required /></label>
                <button type="submit">Criar tarefa</button>
            </form>
        </div>
        <div id="lista-tarefas"></div>
    </section>

    <section id="sec-notificacoes" class="secao">
        <h2>Notificações</h2>
        <div id="lista-notificacoes"></div>
    </section>

    <section id="sec-admin-usuarios" class="secao">
        <h2>Usuários (admin)</h2>
        <div class="cartao">
            <h3>Criar professor/admin</h3>
            <form id="form-novo-usuario" class="formulario">
                <label>Matrícula <input type="text" id="usuario-matricula" required /></label>
                <label>Nome <input type="text" id="usuario-nome-campo" required /></label>
                <label>E-mail <input type="email" id="usuario-email" required /></label>
                <label>Senha <input type="password" id="usuario-senha" required /></label>
                <label>Role
                    <select id="usuario-role-campo">
                        <option value="PROFESSOR">Professor</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </label>
                <p id="novo-usuario-msg" class="msg"></p>
                <button type="submit">Criar usuário</button>
            </form>
        </div>
        <div id="lista-usuarios"></div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
