services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: classhub
      POSTGRES_USER: classhub
      POSTGRES_PASSWORD: classhub
    ports:
      - "5432:5432"
    volumes:
      - classhub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: classhub
      DB_USER: classhub
      DB_PASSWORD: classhub
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  classhub-db-data:
